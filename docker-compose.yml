services:
  mongo:
    # MongoDB 5.0+ requires CPU AVX; use 4.4 on older hosts (e.g. HP Z800 / pre-AVX Xeon).
    # On AVX-capable hardware you can switch to mongo:7 (new data dir / dump-restore if upgrading).
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - vrika_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongo --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vrika_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./binary:/binary
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      # Agent runs separately (~/nyxstrike docker compose); API reaches it on the host.
      AGENT_MICROSERVICE_URL: http://host.docker.internal:8888
      AGENT_TOOL_STREAM_REDIS_URL: redis://host.docker.internal:6379/0
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
    networks:
      default: {}
      prowler:
        aliases:
          - vrika-server-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:2.2.355
    container_name: vrika-presidio-analyzer
    ports:
      - "5001:3000"
    restart: unless-stopped
    networks:
      - default

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.355
    container_name: vrika-presidio-anonymizer
    ports:
      - "5002:3000"
    restart: unless-stopped
    networks:
      - default

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      PY_API_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vrika_mongo:
    name: vrika_mongo

  vrika_redis:
    name: vrika_redis

networks:
  default:
    name: vrika-network
  prowler:
    external: true
    name: vrika-cloud-security_default